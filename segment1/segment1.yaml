module: Every Cell Gets a Receipt
segment: 1
title: A Source in Every Cell
description: What Google changed in Sheets in October 2026, and how a value filled by Gemini comes to carry the pages behind it.
voice_notes:
  - Conversational pace, a host thinking aloud with a colleague. Plain sentences, no rush.
  - '"Gemini" is read JEM-in-eye. "Fill with Gemini" is read "Fill with JEM-in-eye". "Google Sheets" and "Google Search" are plain words. "AI function" is read "A I function". "EchoNerve" is read "Echo Nerve". "Workspace" is a plain word.'
  - Numbers are spoken in words, "two hundred", "three thousand", "fifty-five times", "ninety-five". Dates in full spoken form, "the twenty-eighth of October, twenty twenty-six"; months with years as "June twenty twenty-five".
hook_status: partially supported; per-cell web sources in Fill with Gemini and "a citation shows origin, not correctness" are in all three briefs; the hook's 30 October date is wrong (announced 28 October 2026, rollout from 20 October), so the narration says late October.
value_status: partially supported; the 41 percent sampling figure is computed in all three briefs, the four-step ladder is the module's own framework, and the hands-on's reliance on Sources surviving a shared copy is unverified (not used in this segment).
slides:
  - layout: cover
    title: A Source in Every Cell
    subtitle: A column of AI-filled company facts arrives, we check the first few rows, and we pass it on.
    narration: >
      A list of company facts lands in our shared folder, filled in by AI in a few seconds,
      and someone has to decide whether it is good enough to send on. Headquarters city,
      headcount, one value for every company. So we do what most teams do. We open the first
      five companies, they look right, and we pass the whole list along. Until October, that
      habit was a guess with nothing behind it. Every value Fill with Gemini wrote into Google
      Sheets looked like ordinary typed text, with no trail back to where it came from, so a
      wrong city and a right one looked exactly alike. Since late October twenty twenty-six,
      each value Gemini finds on the web arrives with the pages it used. That makes any single
      value checkable on its own. A receipt records where Gemini looked, and with a long list in
      front of us the useful question becomes how much of it we actually have to open. First,
      let's see how a value comes to carry its receipt at all.
    sources:
      - claim: Teams routinely spot-check the first five values of an AI-filled list and sign off on the rest
        briefs: [research-brief-gemini]
        url: https://analyticsmadesimple.com/tutorials/fill-with-gemini-google-sheets-check-sources/
        date: 2026-11-25
      - claim: Before the October 2026 update, values filled by Fill with Gemini carried no sources and looked like plain text
        briefs: [research-brief-openai, research-brief-gemini, research-brief-claude]
        url: https://www.ud.hk/resources/ai/2026-07-10-fill-with-gemini-sheets
        contradiction: 'Claude brief: an undated Google help snippet says the Sources view was "currently available only to users in Workspace Experiments and Beta programs"; Gemini brief: Clay showed per-row sources in a spreadsheet grid since 2023.'
        side_taken: Scoped to general Google Sheets users, for whom neither the April 2026 nor the October 2025 post mentions sources; testers and other products are left out of the narration.
      - claim: Since late October 2026, each web-sourced value carries the pages Gemini used, inside that cell
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
        url: https://workspaceupdates.googleblog.com/2026/10/fill-with-gemini-now-provides-cell-level-citations-for-web-sources-and-supports-larger-requests.html
        date: 2026-10-28
      - claim: A citation records where Gemini looked, which is different from showing the value is right
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
        url: https://echonerve.substack.com/p/how-to-check-3000-ai-filled-spreadsheet

  - layout: timeline
    title: How a filled value got its sources
    milestones:
      - date: June 2025
        label: Google adds the AI function, which fills only the first 200 selected cells.
      - date: October 2025
        label: The function starts answering from Google Search and shows no sources.
      - date: April 2026
        label: Fill with Gemini lets us drag down or select empty cells and fill them.
      - date: October 2026
        label: Every web-sourced cell now carries its sources, up to 3,000 cells a request.
    note: "MONITOR: Rollout began on 20 October 2026, in Sheets on the web only and on eligible paid plans. Google's help page still says a run fills only the first 350 selected cells."
    narration: >
      The receipts arrived at the end of a short history, and each step in it changed what a
      filled value could tell us. Google added the AI function to Sheets in June twenty
      twenty-five. It wrote text into a selection, and only the first two hundred selected
      cells got an answer, so any mistake stayed small and close to hand. In October twenty
      twenty-five the function started answering from Google Search, which meant it could
      fill in facts nobody had typed into the sheet, like the city a company is based in.
      Google's announcement of that change never mentions sources. From that point the values
      could come from the open web, and nothing in the sheet said which page they came from.
      In April twenty twenty-six, Fill with Gemini arrived as a quicker way into the same
      function. We drag down from one finished example, or select empty cells and press Fill,
      and the whole range fills itself. Then, on the twenty-eighth of October twenty twenty-six,
      Google's Workspace team announced that every value drawn from the web now carries the
      exact pages behind it, kept with that one value, in Sheets on the web. The same
      announcement raised a single request to three thousand cells. That second change gets
      far less attention than the first, and it matters just as much.
    sources:
      - claim: The AI function launched on 25 June 2025 and generated only the first 200 selected cells
        briefs: [research-brief-claude, research-brief-gemini]
        url: https://workspaceupdates.googleblog.com/2025/06/generate-data-with-gemini-in-google-sheets.html
        date: 2025-06-25
      - claim: From 15 October 2025 the AI function was grounded in Google Search, and that post never mentions sources
        briefs: [research-brief-claude]
        url: https://workspaceupdates.googleblog.com/2025/10/enhanced-ai-function-sheets-google-search.html
        date: 2025-10-15
      - claim: Fill with Gemini launched on 22 April 2026 as an entry point to the AI function, by drag or by selecting empty cells and clicking Fill
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
        url: https://workspaceupdates.googleblog.com/2026/04/effortlessly-automate-data-entry-in-Google-Sheets-using-Fill-with-Gemini.html
        date: 2026-04-22
      - claim: Google announced cell-level web sources on 28 October 2026, rollout from 20 October 2026, Sheets on the web only, eligible plans
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
        url: https://workspaceupdates.googleblog.com/2026/10/fill-with-gemini-now-provides-cell-level-citations-for-web-sources-and-supports-larger-requests.html
        date: 2026-10-28
        contradiction: 'The module hook says "On 30 October 2026"; 30 October 2026 is the date of the Google Workspace Weekly Recap that relisted the item.'
        side_taken: 28 October 2026 in narration and on the rail (as October 2026); rollout from 20 October on the MONITOR caption; 30 October not used.
        monitor: true
      - claim: The same update raised a single request to up to 3,000 cells
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
        url: https://workspaceupdates.googleblog.com/2026/10/fill-with-gemini-now-provides-cell-level-citations-for-web-sources-and-supports-larger-requests.html
        date: 2026-10-28
        contradiction: 'Google Help: "only the first 350 selected cells with AI functions will be generated" (Claude, Gemini briefs).'
        side_taken: 3,000 as Google's announcement states it, in narration and on the rail; the 350-cell help page goes on the MONITOR caption.
        monitor: true

  - layout: flow
    title: From an empty cell to a cited value
    nodes:
      - We ask Sheets to fill empty cells.
      - The function sees only the row we point it at.
      - Google Search finds pages, and Gemini writes one value.
      - The pages Gemini used attach to that one cell.
    footer: The value is fixed once inserted, so it does not refresh when the web page changes.
    narration: >
      Knowing when the receipts arrived, we can build the chain that produces one, a link at a
      time, because each link is a place where a value can go wrong. It starts with a request.
      We select some empty cells and ask Sheets to fill them, or drag down from one finished
      example, and underneath sits the same AI function as before. The second link is the one
      most people miss. The function cannot read the whole spreadsheet or anything else in our
      Drive. It sees the prompt and only the part of the sheet we point it at, usually the
      company name in that same row. So that one name is all the context it has, and a vague
      name gets a vague answer. Third, because the question is about the outside world, the
      function runs a Google Search, and Gemini writes one short value from the pages that come
      back. Fourth, the pages it used are attached to that one value, and anyone can open them
      by clicking into it, hovering, and choosing Sources. That is the receipt. One more fact
      about the finished value changes how we read it. Once inserted, it stays fixed. Google
      says it does not refresh by itself, and when a prompt is built by joining cells together
      we don't even get a prompt to refresh. So if a company's headcount changes after the fill,
      the value keeps the old number, and the page behind it may already say something else.
    sources:
      - claim: Fill with Gemini is an entry point to the existing AI function, started by dragging or by selecting empty cells
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
        url: https://workspaceupdates.googleblog.com/2026/04/effortlessly-automate-data-entry-in-Google-Sheets-using-Fill-with-Gemini.html
      - claim: The function does not have access to the entire spreadsheet or other Drive files; it sees the prompt and the range it is pointed at
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
        url: https://support.google.com/docs/answer/15877199?hl=en
      - claim: For factual questions the function is grounded in Google Search results
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
        url: https://workspaceupdates.googleblog.com/2025/10/enhanced-ai-function-sheets-google-search.html
      - claim: The pages used are attached to each cell and opened by clicking into the cell, hovering and clicking Sources
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
        url: https://support.google.com/docs/answer/15877199?hl=en
      - claim: A generated value is inserted as an edit and does not refresh; prompts built by joining cells give no refresh prompt
        briefs: [research-brief-claude, research-brief-gemini]
        url: https://support.google.com/docs/answer/15877199?hl=en
      - claim: A company's headcount can change after the fill while the cited page or value stays as it was (illustrative)
        briefs: [research-brief-gemini, research-brief-openai]

  - layout: two_number
    title: One value cheaper, one run bigger
    before:
      value: 200 cells
      label: In June 2025, one run of the AI function filled at most 200 selected cells.
    after:
      value: 3,000 cells
      label: In October 2026, one request can fill up to 3,000 cells, each with its own sources.
    takeaway: Each value got cheaper to check, and each run got fifteen times bigger.
    note: "MONITOR: Google's help page still says a run fills only the first 350 selected cells. The 55 times speed figure comes from Google's own study of a 500-cell task."
    narration: >
      The same announcement that made one value cheap to check also made each run much bigger,
      and those two changes pull in opposite directions. When the AI function launched, a
      single run stopped at two hundred cells. Now one request can fill three thousand, fifteen
      times as many, and every one of them arrives with its own sources. Google also says that
      filling five hundred cells is up to fifty-five times faster than typing them in by hand,
      from its own study of ninety-five people. That figure measures how fast values go in. It
      says nothing about how fast anyone checks them, and checking still happens one value at a
      time, at just under a minute each. The writer of the EchoNerve newsletter put the problem
      in five words. Nobody opens three thousand sources. He also noticed what the receipts do
      to the person reading the sheet. A list that fills itself in seconds, with a web source
      on every value, looks checked, and that look is the risk. At just under a minute each,
      three thousand values is close to fifty hours of reading, which no team spends on a list
      of company facts. So the small habit worth keeping is to count before we trust. When
      a filled list arrives, we note how many of its values came from the web, and we decide how
      many we will open before it goes anywhere. Deciding that well starts with knowing what one
      of those sources actually proves.
    sources:
      - claim: At launch in June 2025 the AI function generated only the first 200 selected cells
        briefs: [research-brief-claude, research-brief-gemini]
        url: https://workspaceupdates.googleblog.com/2025/06/generate-data-with-gemini-in-google-sheets.html
        date: 2025-06-25
      - claim: Up to 3,000 cells per request from October 2026, fifteen times the 200-cell launch cap (computed)
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
        url: https://workspaceupdates.googleblog.com/2026/10/fill-with-gemini-now-provides-cell-level-citations-for-web-sources-and-supports-larger-requests.html
        date: 2026-10-28
        contradiction: 'Google Help: "only the first 350 selected cells with AI functions will be generated"; McKelvey: "Google doesn''t say."'
        side_taken: 3,000 as Google's announcement states it; the 350-cell help page is on the MONITOR caption, never spoken.
        monitor: true
      - claim: Up to 55 times faster than manual entry for 500-cell tasks, from a 95-participant internal Google study
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
        url: https://workspaceupdates.googleblog.com/2026/10/fill-with-gemini-now-provides-cell-level-citations-for-web-sources-and-supports-larger-requests.html
        date: 2026-10-28
        monitor: true
      - claim: Checking one cited cell takes under a minute (Jose S., Analytics Made Simple)
        briefs: [research-brief-gemini]
        url: https://analyticsmadesimple.com/tutorials/fill-with-gemini-google-sheets-check-sources/
        date: 2026-11-10
      - claim: 3,000 values at just under a minute each is close to fifty hours (computed from the under-a-minute figure)
        briefs: [research-brief-gemini]
      - claim: 'Saurabh Shukla, EchoNerve newsletter, exact: "Nobody opens 3,000 sources."; paraphrase of "It looks checked. I think that look is the risk."'
        briefs: [research-brief-claude]
        url: https://echonerve.substack.com/p/how-to-check-3000-ai-filled-spreadsheet
        date: 2026-11-04
