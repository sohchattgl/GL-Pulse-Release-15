  - layout: table
    title: What each extra cell buys
    columns: [Cells checked at random, Chance of catching one in ten, Time at under a minute a cell]
    rows:
      - [5 cells, Finds an error 41% of the time, About five minutes]
      - [10 cells, Finds an error 65% of the time, About ten minutes]
      - [20 cells, Finds an error 88% of the time, About twenty minutes]
      - [30 cells, Finds an error 96% of the time, About half an hour]
    takeaway: Thirty random cells take about half an hour and bring the ceiling on errors under 10%.
    narration: >
      Every cited cell we open takes under a minute to read against its page, so a bigger sample costs us minutes and buys a better chance of catching a problem.
      Five random cells take about five minutes and catch a one-in-ten error rate forty-one percent of the time.
      That makes five a smoke test, good for spotting a broken prompt before we spend a day on it, and poor grounds for a sign-off.
      Ten cells take about ten minutes and lift the catch rate to sixty-five percent.
      Twenty cells, about twenty minutes, reach eighty-eight percent.
      Twenty-nine cells is where the chance of catching a one-in-ten problem first passes ninety-five percent, and thirty cells, about half an hour, give ninety-six percent along with the ceiling under ten percent we just worked out.
      Thirty random cells is about half an hour, and that half hour is what "under ten percent" costs.
      Which columns deserve that half hour, and which deserve more, is the next thing to settle.
