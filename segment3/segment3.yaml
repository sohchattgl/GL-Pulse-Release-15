        date: 2026-11-10
      - claim: A random sample is drawn by giving every row a random number, freezing it, sorting by it and checking the first rows
        briefs: [research-brief-gemini]
        url: https://analyticsmadesimple.com/tutorials/fill-with-gemini-google-sheets-check-sources/
        date: 2026-11-10
  - layout: stat_hero
    title: How often five cells catch it
    number: 41%
    caption: If one cell in ten is wrong, a check of five random cells finds at least one error 41% of the time.
    note: On a 20-row list with two wrong values, the same check finds an error about 45% of the time.
    narration: >
      Suppose one cell in ten across the whole list is wrong, and we open five at random.
      Each cell we open has a nine in ten chance of being clean, so five clean draws in a row happen about six times in ten.
      That means the check finds at least one error only about forty-one percent of the time.
      Most of the time, a list with a real problem passes a five-cell check without a mark against it.
      And that pass looks exactly like the pass we would get from a list with no errors at all, because the wrong values carry the same confident text and the same tidy citation as the right ones.
      On a short list the arithmetic shifts a little. With twenty companies and two wrong values, every clean cell we draw leaves fewer clean cells behind, so the chance of catching an error rises to about forty-five percent.
      That is still worse than a coin toss.
      The sentence worth keeping is that a five-cell check misses a one-in-ten problem more often than it catches it.
      So a clean result from five cells is weak evidence, and the useful next step is to ask exactly how weak.
    sources:
      - claim: If one cell in ten is wrong, a five-cell random check catches at least one error 41% of the time (1 minus 0.9 to the fifth, 40.95%)
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
        url: https://itl.nist.gov/div898/handbook/eda/section3/eda366i.htm
        date: 2026-11-25
      - claim: Five clean draws in a row happen about six times in ten (0.9 to the fifth, 59.05%)
        briefs: [research-brief-claude, research-brief-gemini]
      - claim: On a 20-row list with two wrong values, a five-cell check catches an error about 45% of the time (44.7%)
        briefs: [research-brief-claude, research-brief-gemini]
        url: https://www.itl.nist.gov/div898/handbook/glossary.htm
        date: 2026-11-25
  - layout: two_number
    title: What a clean result rules out
    before:
      value: 45%
      label: After five clean cells, the column could still be up to 45% wrong.
    after:
      value: Under 10%
      label: After thirty clean cells, the highest error rate still possible falls under 10%.
    note: Each figure is the highest error rate that still gives a clean result at least one time in twenty.
    narration: >
      Let's turn the question around, because the one a manager asks after a clean result is how bad the list could still be.
      Five cells came back clean. What is the highest error rate that would still hand us five clean cells at least one time in twenty?
      The answer is forty-five percent.
      A list where almost half the values are wrong will pass a five-cell check about once in every twenty tries, so a clean five cannot rule it out.
      The five clean cells we signed off on are consistent with almost half the list being wrong.
      Adding cells pulls that ceiling down, slowly. At ten clean cells it sits near twenty-six percent.
      The tutorial writer we met a moment ago puts it plainly: ten clean checks still leave room for up to about one wrong cell in three.
      His rule of thumb runs a little high, and the careful figure is closer to one in four, though the point holds either way.
      At twenty clean cells the ceiling is about fourteen percent.
      Only at thirty clean cells does it fall under ten percent, to about nine and a half.
      Thirty is where a clean result starts to mean what we hoped five meant.
    sources:
