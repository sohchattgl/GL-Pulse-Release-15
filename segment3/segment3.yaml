module: Every Cell Gets a Receipt
segment: 3
title: Five Clean Cells
description: What a small clean sample of cited cells shows, and what a sample large enough to sign off on costs in time.
voice_notes:
  - Conversational pace, a host thinking aloud with a colleague. Plain sentences, no rush.
  - '"Gemini" is read "JEM-in-eye". "Google Sheets" as two plain words.'
  - Percentages read in full, "forty-one percent", "nine and a half percent". "One in ten", "one in four" and "one time in twenty" are read as words.
hook_status: partially supported; citations per cell and the reading that a citation records origin only are in all three briefs, and the announcement is 28 October 2026 with rollout from 20 October
value_status: partially supported; the 41% figure is supported by computation in all three briefs, and the larger sample sizes are computed from the same formula
slides:
  - layout: cover
    title: Five Clean Cells
    subtitle: We check five cells, all five match their sources, and we sign off on the whole column.
    narration: >
      With thousands of values in a sheet, most teams settle the question the same way, and it feels responsible while we do it.
      Someone opens the first five companies on the list, clicks through to each cited page, and finds the value sitting there every time.
      Five out of five. The sheet goes into the board pack with a note that it has been checked, and everyone moves on to the next deadline.
      You've probably signed off on a sheet like this yourself, and the habit has a lot going for it.
      It's quick, it uses the citations the way they were meant to be used, and every one of those five values really was right.
      So the question is what those five clean cells tell us about the hundreds of cells nobody opened.
      Two things decide the answer. One is which five we chose, because a convenient five and a fair five can give very different answers.
      The other is how many we checked, because five is a small number, and small numbers can look like proof when they are mostly luck.
      Let's take the choice first, since it costs almost nothing to get right.
    sources:
      - claim: Teams routinely spot-check the first five rows of a column, see five matches and sign off on the rest
        briefs: [research-brief-gemini]
        url: https://analyticsmadesimple.com/tutorials/fill-with-gemini-google-sheets-check-sources/
        date: 2026-11-25
  - layout: two_card
    title: Which five cells we open
    left:
      head: The first five rows
      lede: The convenient choice.
      body:
        - A curated list starts with the larger, better-documented companies.
        - Their values pass more often, so they tell us least about the rest.
    right:
      head: Five rows at random
      lede: The fair choice.
      body:
        - Give every row a random number, freeze it, and sort by it.
        - The first five after the sort are a fair sample of the whole list.
    takeaway: A random draw costs a few clicks and gives every company the same chance of a check.
    narration: >
      The convenient five are usually the first five, and the start of a list is rarely a fair picture of what comes after it.
      A tutorial writer who teaches spreadsheet analysis calls checking only the first five or ten companies a classic mistake, and the reason is how lists get built.
      Whoever curates a supplier or prospect list puts the names they know first, and the names they know are the larger, better-documented companies.
      Those companies have current websites, recent filings and plenty of press coverage, so Gemini finds the right value for them more often.
      The small, privately held firms further down the list are where a stale directory entry or the wrong subsidiary's city slips in.
      So a check of the first five companies tests the easiest values we have and reports the result as if it covered the hardest.
      The remedy is a decision to choose at random, and it costs a few clicks.
      He gives every company on the list a random number, freezes those numbers so they stop changing, sorts by them, and checks whatever lands first.
      Now every value has the same chance of being opened, and five clean cells say something about the whole list instead of its easiest stretch.
      The next question is how much they say.
    sources:
      - claim: Checking only the first five or ten rows is a classic error, because the start of a curated list holds larger, better-documented companies
        briefs: [research-brief-gemini]
