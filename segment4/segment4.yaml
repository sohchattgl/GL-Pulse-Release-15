  - layout: stat_hero
    title: One list, thirty random checks
    number: 29 of 30
    caption: A list of 200 supplier headquarters passed 29 of 30 random checks, and every row sourced from a business directory was then checked one by one.
    note: Jose S., who writes the Analytics Made Simple tutorials, published this worked example in November 2026.
    narration: >
      That routine has been run end to end, in public, by a tutorial writer who teaches spreadsheet analysis.
      He had Gemini fill the headquarters city for a list of two hundred suppliers, then froze the answers as plain values
      so they could not shift while he worked. He put a random number beside every supplier, fixed those numbers, and sorted by them,
      so the thirty he checked were a fair draw. For each one he opened the cited page and looked for the city,
      in under a minute apiece, so the whole check cost less than half an hour. Twenty-nine matched their pages. One did not. The note he wrote is one sentence long:
      thirty random rows checked against sources, twenty-nine matched, directory-sourced rows checked individually.
      That last clause is the loop at work. The note named the kind of page to distrust, the business directory,
      and every supplier that leaned on one got a check of its own. One miss in thirty, spread across two hundred suppliers,
      would leave several more wrong cities among the values nobody opened, and that follow-up is what goes looking for them.
    sources:
      - claim: Jose S. (Analytics Made Simple) filled a 200-supplier headquarters list, froze it as values, drew 30 random rows with a random-number column, and 29 matched
        briefs: [research-brief-gemini]
        url: https://analyticsmadesimple.com/tutorials/fill-with-gemini-google-sheets-check-sources/
        date: 2026-11-10
      - claim: Audit note "30 random rows checked against sources, 29 matched; directory-sourced rows checked individually" (exact)
        briefs: [research-brief-gemini]
        url: https://analyticsmadesimple.com/tutorials/fill-with-gemini-google-sheets-check-sources/
        date: 2026-11-10
      - claim: Checking one cited cell takes under a minute
