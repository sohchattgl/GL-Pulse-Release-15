module: Every Cell Gets a Receipt
segment: 4
title: How Much to Check
description: Turns the sampling arithmetic into a four-step checking routine and a checking tier for each column by its use, then closes the module.
voice_notes:
  - Conversational pace, a host thinking aloud. Plain sentences, no rush.
  - '"Gemini" is read "JEM-in-eye". "EchoNerve" is read "Echo Nerve". "UDomain" is read "You Domain".'
  - '"29 of 30" is read "twenty-nine of thirty". Percentages are read in full, as "forty-five percent" and "ten percent".'
hook_status: "partially supported: per-cell citations and origin-not-correctness in all three briefs; the 30 October date is unsupported (announced 28 October 2026, rollout from 20 October 2026)"
value_status: "partially supported: the 41% figure is computed in all three briefs; the four-step routine is the module's own framework; the hands-on is unverified and is not referenced in this segment"
slides:
  - layout: cover
    title: How Much to Check
    subtitle: A colleague asks how sure we are of the filled column before it goes into a pricing decision.
    narration: >
      Half an hour of checking is easy to agree to in principle, and harder when someone is waiting on the answer.
      Imagine a filled list of supplier figures, a few hundred values, each one carrying the pages behind it,
      and a colleague who needs it for a pricing decision this afternoon. They ask one question. How sure are we?
      Gemini can now fill a long list in a single request, and every value arrives looking equally finished.
      If we treat a visible source as proof, unchecked numbers move straight into pricing, supplier and headcount decisions,
      at the speed the tool was built for. So what routine do we follow before we vouch for a filled list,
      and how much of it does each list deserve? A first look and a figure that sets a price
      cost different amounts when they go wrong, and our checking has to tell them apart.
    sources:
      - claim: Treating a visible source as proof can push unverified numbers into pricing, supplier or headcount decisions
        briefs: [research-brief-gemini]
        url: https://workspaceupdates.googleblog.com/2026/10/fill-with-gemini-now-provides-cell-level-citations-for-web-sources-and-supports-larger-requests.html
        date: 2026-11-25
      - claim: Managers need a clear sampling rule and an audit note attached to every AI-filled deliverable
        briefs: [research-brief-gemini]
        url: https://analyticsmadesimple.com/tutorials/fill-with-gemini-google-sheets-check-sources/
        date: 2026-11-25

  - layout: flow
    title: A routine for one filled column
    nodes: [Read the citation, Check a random sample, Cross-check a second source, Sign off with a note]
    loop_back: true
    footer: When a sample fails, that kind of row goes back for a check of every value.
    note: No vendor names these four steps; they gather what careful practitioners already do.
    narration: >
      The routine we need can be built from the ways a single value goes wrong, one failure at a time.
      A citation tells us where Gemini looked, and nothing about whether the page says what the value says.
      So the opening step is to read the citation: open the page and find the sentence that states the value.
      An independent tester who audits the citations of AI assistants puts the rule simply: require the exact page, then find the claim on it.
      The next failure is scale. We can't read every page, and if we read only the first few names on a sorted list,
      we read the best-documented companies, the ones least likely to be wrong.
      So we check a sample picked at random. After that comes the page itself. One page can be out of date,
      and two good pages can measure different things, full-time staff on one and headcount with contractors on the other.
      So anything that matters gets a second source. And nobody downstream can see any of this checking,
      so we sign off with a note that says what we did. When the sample turns up a failure, the routine loops back,
      and that kind of value gets checked in full. No vendor publishes these four steps. They gather what careful
      practitioners already do, treating each citation as a route to the evidence.
    sources:
      - claim: The four-step routine (read, sample, cross-check, sign off) is the module's own framework, not a named external standard
        briefs: [research-brief-claude, research-brief-gemini, research-brief-openai]
      - claim: Ben Dixon's advice to "require the exact page, then find the claim on it" (spoken by role, paraphrase of exact quote)
        briefs: [research-brief-claude]
        url: https://dixon.ai/posts/ai-cites-wrong-source/
        date: 2026-11-25
      - claim: Checking only the top rows is biased because larger firms are better documented
        briefs: [research-brief-gemini]
        url: https://analyticsmadesimple.com/tutorials/fill-with-gemini-google-sheets-check-sources/
        date: 2026-11-25
      - claim: A source can be out of date, or two credible sources can measure different scopes (full-time staff against headcount with contractors)
        briefs: [research-brief-gemini, research-brief-openai]
        contradiction: "Claude: 'This failure mode is plausible but has no evidence for Sheets'; OpenAI: 'We did not find a source stating out of date or disagree as separate points.'"
        side_taken: taught as a failure mode in plain terms with an illustrative example, as the reconciliation directs; no Sheets case is claimed
      - claim: Gary Stanton (AIAdoptionTrends) on using cell citations as a route to the evidence, then checking each decision-changing fact (paraphrase; spoken by role)
        briefs: [research-brief-openai]
