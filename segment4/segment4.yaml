  - layout: bullets
    title: What we can now do
    bullets:
      - An engineer can read five clean cells as an error ceiling of 45% and size a sample to the error rate a column can afford.
      - A manager can set a checking tier for each AI-filled column by how it will be used, and ask for the audit note that goes with it.
      - An early-career learner can check a cited cell by finding the sentence on the page that states the value, and pick cells at random.
    narration: >
      Everything we've worked through fits into a single sentence, and it's worth saying once.
      A citation tells us where Gemini looked, and how much of a list we check is set by what the list will be used for
      and by the arithmetic of a random sample. What that means depends on where we sit.
      An engineer can now read five clean cells as an error ceiling of forty-five percent,
      and size a sample to the error rate a list can afford. A manager can set a checking tier for each list Gemini fills,
      by how it will be used, and ask for the audit note that goes with it, so trust becomes a sentence someone can question.
      And someone early in their career can check a cited value by finding the sentence on the page that states it,
      and can pick the values to check at random, away from the famous names.
      All of it takes a random number beside each value and the patience to open thirty pages.
    sources:
      - claim: Five clean random cells leave an error ceiling of 45%; thirty clean cells bring it under 10%
        briefs: [research-brief-claude, research-brief-gemini]
      - claim: Checking tiers set by how a column is used, with an audit note
        briefs: [research-brief-claude, research-brief-gemini]
      - claim: Random selection with a random-number column; checking top rows is biased
        briefs: [research-brief-gemini]
        url: https://analyticsmadesimple.com/tutorials/fill-with-gemini-google-sheets-check-sources/
        date: 2026-11-25

  - layout: landing
    title: One thing to keep
    text: "When we hand over a filled column, one line goes with it: how many cells we checked at random, how many matched, and what we did about the rest."
    narration: >
      The habit that carries all of this is a small one. We date each filled value, so the next reader knows how old it is.
      And when we hand over a filled column, one line goes with it: how many cells we checked at random, how many matched,
      and what we did about the rest.
    sources:
      - claim: Record the exact audit summary (rows checked, matches found, failure pattern) alongside the deliverable
        briefs: [research-brief-gemini]
        url: https://analyticsmadesimple.com/tutorials/fill-with-gemini-google-sheets-check-sources/
        date: 2026-11-25
      - claim: Justin McKelvey's advice to add a "last generated" date column so stale answers are easy to spot
        briefs: [research-brief-claude]
        url: https://justinmckelvey.com/blog/gemini-in-google-sheets
        date: 2026-11-07
