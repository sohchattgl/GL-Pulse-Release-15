        briefs: [research-brief-gemini]

  - layout: table
    title: How much each column needs
    columns: [How the column is used, What we check, What we can then say]
    rows:
      - [A first look, Five cells picked at random, The prompt and format are working]
      - [A list the team uses, Thirty cells picked at random, The error rate is likely under 10%]
      - [A figure for a decision, "Every source, or a smaller sheet", Each value was found on its page]
      - [A figure we must defend, A formula; Gemini only adds labels, Each number has a formula trail]
    takeaway: For the columns that matter most, we check every cell or Gemini does not fill them.
    note: The two highest-stakes tiers follow Saurabh Shukla, who writes the EchoNerve newsletter, and the UD Technology Team at UDomain.
    narration: >
      With that routine in hand, the remaining decision is how much of it each list deserves, and the answer rises with
      what the list will be used for. The lightest use is a first look, where we only want to know whether the prompt works.
      Five random cells catch a broken prompt or a messy format before we spend our monthly usage allowance on it.
      That is all five can do, since five clean cells still allow an error rate up to forty-five percent.
      The next use is a list the team works from. A wrong value there wastes effort,
      so we want a ceiling on errors, and thirty clean random cells bring it under ten percent for about half an hour.
      Then comes a figure that changes a decision, a price or a choice of supplier. A sample describes the list as a whole,
      while a decision rests on one value, so a single wrong figure is a wrong decision.
      The writer of the EchoNerve newsletter puts the rule plainly. Open every source, and if that is too many cells,
      the sheet is too big for that use. Beyond that is a figure we must defend to an auditor or a board,
      and the UD Technology Team at a company called UDomain draws the line there. A generated number has no formula trail,
      so we keep the formula and let Gemini only label around it. For the lists that matter most,
      the right amount of checking is every value, or Gemini does not fill them at all.
    sources:
      - claim: Five cells serve as a prompt smoke test before spending usage quotas
